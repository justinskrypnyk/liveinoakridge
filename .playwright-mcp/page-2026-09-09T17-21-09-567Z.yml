        - heading "Oakridge, Then and Now" [level=2] [ref=e134]
        - paragraph [ref=e136]: Justin's family has called Oakridge home since 1959 — through farmland, first construction, and the tree canopy it's known for today.
      - generic [ref=e137]:
        - generic [ref=e138]:
          - img "Aerial photograph of the Thames Valley Golf Course clubhouse, putting green, and parking lot in Oakridge, London Ontario, circa 1930s" [ref=e139]
          - generic [ref=e140]: circa 1930s
          - generic [ref=e141]: Thames Valley's original clubhouse and practice green from the air. Built on Public Utilities Commission land along the Thames River — acquired for the city's water supply wells, not recreation. Photo courtesy London & Area Golf History (londonandareagolfhistory.com), sourced from "From Rough to Fairway" by John Cowie.
        - generic [ref=e142]:
          - img "Golfers Jack Nash, Sandy Somerville, Joe Kirkwood, and Gene Sarazen at the opening of the Thames Valley Classic course, Oakridge, London Ontario, July 29 1933" [ref=e143]
          - generic [ref=e144]: July 29, 1933
          - generic [ref=e145]: Jack Nash, Sandy Somerville, Joe Kirkwood, and Gene Sarazen — four of the biggest names in golf — at Thames Valley's championship opening day. Photo courtesy London & Area Golf History (londonandareagolfhistory.com).
        - generic [ref=e146]:
          - img "Flooded pump house at Thames Valley Golf Course during the Great Flood in Oakridge, London Ontario, 1937" [ref=e147]
          - generic [ref=e148]: "1937"
          - generic [ref=e149]: The Thames River overflowed its banks in the Great Flood of 1937, submerging the pump house and much of the course. Photo courtesy London & Area Golf History (londonandareagolfhistory.com).
        - generic [ref=e150]:
          - img "Eastman Topographic aerial photograph of the Oakridge area in 1942, showing farmland and the Sifton Bog before development, London Ontario" [ref=e151]
          - generic [ref=e152]: "1942"
          - generic [ref=e153]: Eastman Topographic aerial, 1942. The entire Oakridge footprint is open farmland. The dark circular mass at centre is the Sifton Bog — surrounded by fields eight years before the first homes were built.
        - generic [ref=e154]:
          - img "The New Oakridge Park model homes entrance sign standing in an empty field, early 1960s, London Ontario" [ref=e155]
          - generic [ref=e156]: circa 1961
          - generic [ref=e157]: "\"The New Oakridge Park — Model Homes Entrance.\" Sifton's billboard for the second phase of development, standing in open farmland. Behind it: a barn, utility poles, and nothing else."
        - generic [ref=e158]:
          - img "Northway Survey Corporation aerial photograph of Oakridge, London Ontario, April 25 1978, showing completed residential development" [ref=e159]
          - generic [ref=e160]: "1978"
          - generic [ref=e161]: Northway Survey Corporation aerial, April 25, 1978. Oakridge is nearly fully built out — curved residential streets, the Sifton Bog visible at centre, the Thames River and Byron along the lower left.
        - generic [ref=e162]:
          - img "Aerial drone view of Oakridge's mature tree canopy today, London Ontario" [ref=e163]
          - generic [ref=e164]: "2026"
          - generic [ref=e165]: Today. The farmland is gone, the model homes have grown up — decades of maple and oak canopy now cover the streets Justin's family has called home since 1959.
